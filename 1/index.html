<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Калькулятор</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="phone">
    <div class="display-wrap">
      <div class="display" id="display">0</div>
    </div>
    <div class="grid">
      <button class="mem" data-mem="M+">M+</button>
      <button class="mem" data-mem="M-">M-</button>
      <button class="mem" data-mem="MR">MR</button>
      <button class="mem" data-mem="MS">MS</button>

      <button class="func" data-action="clear">AC</button>
      <button class="mem" data-mem="MC">MC</button>
      <button class="op" data-op="%">%</button>
      <button class="op" data-op="/">÷</button>

      <button class="num" data-num="7">7</button>
      <button class="num" data-num="8">8</button>
      <button class="num" data-num="9">9</button>
      <button class="op" data-op="*">×</button>

      <button class="num" data-num="4">4</button>
      <button class="num" data-num="5">5</button>
      <button class="num" data-num="6">6</button>
      <button class="op" data-op="-">−</button>

      <button class="num" data-num="1">1</button>
      <button class="num" data-num="2">2</button>
      <button class="num" data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="num zero" data-num="0">0</button>
      <button class="dot" data-action="dot">,</button>
      <button class="op" data-action="equals">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
